services:
  postgres:
    image: postgres:16-alpine
    container_name: insurance_pg
    environment:
      POSTGRES_DB: insurance_data_eco
      POSTGRES_USER: eco_user
      POSTGRES_PASSWORD: eco_password
    ports:
      - "5405:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: insurance_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: eco_admin
      MONGO_INITDB_ROOT_PASSWORD: eco_password
    ports:
      - "27005:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  pg_data:
  mongo_data:
