<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ошибка — Экология данных</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-6">
<div class="max-w-lg w-full bg-white rounded-xl shadow p-6 space-y-4 border-t-4 border-rose-500">
    <div class="text-sm font-mono text-rose-600" th:text="'HTTP ' + ${statusCode != null ? statusCode : 'Ошибка'}">HTTP 404</div>
    <h1 class="text-xl font-bold" th:text="${title != null ? title : 'Произошла ошибка'}">Ошибка</h1>
    <p class="text-sm text-slate-600" th:text="${message != null ? message : 'Запрос не может быть выполнен.'}">
        Описание ошибки
    </p>
    <div class="pt-2">
        <a th:href="@{/}" class="inline-block bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded text-sm">
            Вернуться на дашборд
        </a>
    </div>
</div>
</body>
</html>
