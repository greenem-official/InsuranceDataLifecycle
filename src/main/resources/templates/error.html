<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка запроса — Data Ecology &amp; Lifecycle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        .font-mono-num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
    </style>
</head>
<body class="bg-[#EAEEF3] text-slate-900 antialiased min-h-screen flex flex-col">

<header class="bg-slate-900 text-white border-b border-slate-800 shadow-sm">
    <div class="max-w-[1380px] mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-4">
        <div class="flex items-center gap-3">
            <div class="w-7 h-7 rounded bg-teal-500/20 border border-teal-400/40 text-teal-300 flex items-center justify-center text-xs font-semibold tracking-tight">
                DE
            </div>
            <span class="font-semibold text-sm text-white">Data Ecology &amp; Lifecycle</span>
        </div>
        <div class="flex items-center gap-2 text-xs">
            <a th:href="@{/}" class="bg-teal-600 hover:bg-teal-500 text-white font-medium px-3 py-1.5 rounded transition">
                На рабочий стол
            </a>
            <a th:href="@{/about}" class="text-slate-300 hover:text-white px-3 py-1.5 rounded border border-slate-700 hover:bg-slate-800 transition">
                Об авторе
            </a>
        </div>
    </div>
</header>

<main class="flex-1 flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-lg bg-white border border-slate-300 border-l-4 border-l-rose-700 rounded-md shadow-xs overflow-hidden">
        <div class="px-5 py-3.5 bg-slate-50 border-b border-slate-300 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="font-mono-num uppercase text-[10px] font-semibold px-1.5 py-0.5 rounded bg-rose-50 text-rose-800 border border-rose-300">ERR</span>
                <span class="text-xs font-semibold text-slate-800">Диагностика состояния запроса</span>
            </div>
            <span class="font-mono-num text-xs font-semibold text-rose-800"
                  th:text="'HTTP ' + ${statusCode != null ? statusCode : 'ERROR'}">HTTP 404</span>
        </div>

        <div class="p-6 space-y-4">
            <h1 class="text-base font-bold text-slate-900" th:text="${title != null ? title : 'Произошла ошибка'}">
                Ресурс не найден
            </h1>
            <p class="text-xs text-slate-600 leading-relaxed bg-slate-50 border border-slate-200 rounded p-3.5"
               th:text="${message != null ? message : 'Запрос не может быть выполнен.'}">
                Описание ошибки
            </p>
            <div class="pt-1 flex flex-wrap items-center gap-2.5 text-xs">
                <a th:href="@{/}"
                   class="bg-slate-900 hover:bg-slate-800 text-white font-medium px-4 py-2 rounded transition">
                    Вернуться на рабочий стол
                </a>
                <a th:href="@{/about}"
                   class="border border-slate-300 bg-white hover:bg-slate-100 text-slate-700 font-medium px-3.5 py-2 rounded transition">
                    Сведения о проекте
                </a>
            </div>
        </div>
    </div>
</main>

</body>
</html>
